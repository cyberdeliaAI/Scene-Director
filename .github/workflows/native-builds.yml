name: Native builds

on:
  workflow_dispatch:
  push:
    branches: [main, scene-director-3.9]
    paths: ['.github/workflows/native-builds.yml', 'desktop/**', '*.py', 'web/**']

permissions:
  contents: read

concurrency:
  group: native-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  draft:
    if: >-
      github.repository == 'cyberdeliaAI/Scene-Director' &&
      github.actor == 'cyberdeliaAI' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/scene-director-3.9') &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Build native Scene Director ')))
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare one draft for this revision
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python desktop/release_native.py initialize

  build:
    needs: draft
    name: Build and verify · ${{ matrix.target }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: macos-arm64
          - os: macos-15-intel
            target: macos-x64
          - os: windows-2022
            target: windows-x64
          - os: ubuntu-22.04
            target: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install build dependencies without signing credentials
        run: |
          python -m venv desktop/.venv
          if [ "$RUNNER_OS" = Windows ]; then
            desktop/.venv/Scripts/python -m pip install -r desktop/requirements-build.txt
          else
            desktop/.venv/bin/python -m pip install -r desktop/requirements-build.txt
          fi
          npm ci --prefix desktop --ignore-scripts --no-audit --no-fund
          node desktop/node_modules/electron/install.js
      - name: Check source and interface
        run: |
          python desktop/check_source_startup.py
          python -m unittest -q
          node --test desktop/*.test.cjs
      - name: Prepare Mac backend without signing credentials
        if: runner.os == 'macOS'
        run: npm run prepare:native --prefix desktop
      - name: Keep Apple ticket lookup on HTTPS over TCP
        if: runner.os == 'macOS'
        # Workaround applies only to the disposable Mac runner, not installed apps.
        run: |
          echo "block return out quick proto udp from any to any port 443" | sudo pfctl -f -
          sudo pfctl -E
      - name: Sign and notarize the native Mac app
        if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run sign:mac --prefix desktop
      - name: Verify Mac app and extracted archive
        if: runner.os == 'macOS'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: python desktop/verify_native.py
      - name: Build native Windows or Linux app
        if: runner.os != 'macOS'
        run: npm run build:native --prefix desktop
      - name: Install Linux display libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0 libnss3 libgbm1 libasound2
      - name: Verify Linux app and extracted archive
        if: runner.os == 'Linux'
        run: xvfb-run -a python desktop/verify_native.py
      - name: Verify Windows app and extracted archive
        if: runner.os == 'Windows'
        run: python desktop/verify_native.py
      - name: Upload verified native download to draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python desktop/release_native.py upload

  verified:
    name: Verify complete release
    needs: [draft, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Require all four verified native downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python desktop/release_native.py verify
